<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonimail - Secure Access</title>
    <style>
        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        #topoCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo {
            font-weight: 200;
            letter-spacing: 8px;
            margin-bottom: 25px;
            font-size: 22px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
        }

        .access-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.4s ease;
            outline: none;
            font-family: inherit;
        }

        .access-btn:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            letter-spacing: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="topoCanvas"></canvas>
    
    <div class="content-wrapper">
        <div class="logo">Sonimail</div>
        <button id="accessBtn" class="access-btn">Access Mailbox</button>
    </div>

    <script>
        // --- 3D Topology Canvas Logic ---
        const canvas = document.getElementById('topoCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            drawTopology();
        }

        function drawTopology() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;
            ctx.lineWidth = 1;

            const lines = 70;
            for (let i = 0; i < lines; i++) {
                ctx.beginPath();
                let yOffset = (height / lines) * i;
                for (let x = -50; x <= width + 50; x += 15) {
                    let noise = Math.sin(x * 0.002 + i * 0.08) * 50 + 
                                Math.sin(x * 0.005 + i * 0.03) * 30 +
                                Math.cos(x * 0.001 - i * 0.05) * 60;
                    let y = yOffset + noise;
                    if (x === -50) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                let alpha = 0.15 + (i / lines) * 0.25;
                ctx.strokeStyle = `rgba(45, 45, 45, ${alpha})`;
                ctx.stroke();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Auth Redirect Logic ---
        const btn = document.getElementById('accessBtn');
        btn.addEventListener('click', function() {
            btn.style.pointerEvents = 'none';
            btn.style.color = '#fff';
            btn.textContent = 'Authenticating...';
            
            setTimeout(() => {
                window.location.href = "https://www.icloud.com/mail";
            }, 800);
        });
    </script>
</body>
</html>
