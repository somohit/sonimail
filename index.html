<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonimail - Secure Access</title>
    <style>
        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 3D Topology Background */
        #topoCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 360px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(5, 5, 5, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(40, 40, 40, 0.5);
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .logo {
            font-weight: 200;
            letter-spacing: 6px;
            margin-bottom: 60px;
            font-size: 20px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-container {
            position: relative;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 16px;
            padding: 12px 0;
            outline: none;
            transition: border-color 0.4s ease, opacity 0.4s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        input::placeholder {
            color: #555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        input:focus {
            border-bottom: 1px solid #888;
        }

        .fade-transition {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="topoCanvas"></canvas>
    
    <div class="login-wrapper">
        <div class="logo">Sonimail</div>
        <form id="authForm">
            <div class="input-container">
                <input type="text" id="credentialInput" placeholder="Identity" autocomplete="off" required autofocus>
            </div>
        </form>
    </div>

    <script>
        // --- 3D Topology Canvas Logic ---
        const canvas = document.getElementById('topoCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            drawTopology();
        }

        function drawTopology() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;
            ctx.lineWidth = 1;

            const lines = 70;
            for (let i = 0; i < lines; i++) {
                ctx.beginPath();
                let yOffset = (height / lines) * i;
                for (let x = -50; x <= width + 50; x += 15) {
                    let noise = Math.sin(x * 0.002 + i * 0.08) * 50 + 
                                Math.sin(x * 0.005 + i * 0.03) * 30 +
                                Math.cos(x * 0.001 - i * 0.05) * 60;
                    let y = yOffset + noise;
                    if (x === -50) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                let alpha = 0.15 + (i / lines) * 0.25;
                ctx.strokeStyle = `rgba(45, 45, 45, ${alpha})`;
                ctx.stroke();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Auth Redirect Logic ---
        const form = document.getElementById('authForm');
        const input = document.getElementById('credentialInput');
        let currentStep = 'identity'; 

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (currentStep === 'identity' && input.value.trim() !== '') {
                input.classList.add('fade-transition');
                setTimeout(() => {
                    input.type = 'password';
                    input.value = '';
                    input.placeholder = 'Passkey';
                    input.classList.remove('fade-transition');
                    input.focus();
                    currentStep = 'passkey';
                }, 400);
            } else if (currentStep === 'passkey' && input.value.trim() !== '') {
                input.classList.add('fade-transition');
                setTimeout(() => {
                    input.type = 'text';
                    input.value = '';
                    input.placeholder = 'Redirecting to secure server...';
                    input.disabled = true;
                    input.classList.remove('fade-transition');
                    
                    // Redirects to iCloud Mail after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = "https://www.icloud.com/mail";
                    }, 1500);
                }, 400);
            }
        });
    </script>
</body>
</html>
